<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>J.A.R.V.I.S.</title>
</head>
<body>

  <button id="core-btn">LIGAR REATOR ARC</button>
  <div id="display-text">Clique no botão para falar com o J.A.R.V.I.S.</div>

  <script>
    let vozesSistema = [];

    function carregarVozes() {
      vozesSistema = window.speechSynthesis.getVoices();
    }

    carregarVozes();
    if (window.speechSynthesis.onvoiceschanged !== undefined) {
      window.speechSynthesis.onvoiceschanged = carregarVozes;
    }

    function falar(texto) {
      window.speechSynthesis.cancel();

      const textoLimpo = texto
        .replace(/\(.*?\)/g, '')
        .replace(/^\d+\.\s*/gm, '')
        .trim();

      const utterance = new SpeechSynthesisUtterance(textoLimpo);
      utterance.lang = 'pt-BR';

      if (vozesSistema.length === 0) {
        vozesSistema = window.speechSynthesis.getVoices();
      }

      const nomesMasculinos = ['Antonio', 'Humberto', 'Felipe', 'Daniel', 'Ricardo', 'Jorge', 'Tiago', 'Male'];

      const vozMasculina = vozesSistema.find(v =>
        v.lang.includes('pt') &&
        nomesMasculinos.some(nome => v.name.toLowerCase().includes(nome.toLowerCase()))
      );

      if (vozMasculina) {
        utterance.voice = vozMasculina;
        utterance.pitch = 0.92;
        console.log("🎙️ Voz masculina selecionada:", vozMasculina.name);
      } else {
        const vozPadraoPT = vozesSistema.find(v => v.lang.includes('pt-BR'));
        if (vozPadraoPT) utterance.voice = vozPadraoPT;
        utterance.pitch = 0.75;
        console.log("⚠️ Nenhuma voz masculina nativa encontrada. Usando ajuste grave na voz:", vozPadraoPT?.name);
      }

      utterance.rate = 1.02;
      window.speechSynthesis.speak(utterance);
    }

    const coreBtn = document.getElementById('core-btn');
    const displayText = document.getElementById('display-text');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      displayText.innerText = "Navegador não suporta a Web Speech API.";
    } else {
      const recognition = new SpeechRecognition();

      recognition.lang = 'pt-BR';
      recognition.continuous = false;
      recognition.interimResults = false;

      coreBtn.addEventListener('click', () => {
        try {
          window.speechSynthesis.cancel();
          recognition.start();
          coreBtn.classList.add('listening');
          displayText.innerText = "Ouvindo você, Senhorita...";
        } catch (e) {
          console.log("Reconhecimento já estava ativo ou em transição:", e);
        }
      });

      recognition.onresult = async (event) => {
        const transcricao = event.results[0][0].transcript;
        console.log("Transcrição capturada:", transcricao);

        coreBtn.classList.remove('listening');
        displayText.innerText = `Você: "${transcricao}" — Processando...`;

        try {
          const respostaServidor = await fetch('http://localhost:3000/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: transcricao })
          });

          const data = await respostaServidor.json();

          displayText.innerText = `"${data.reply}"`;
          falar(data.reply);
        } catch (err) {
          displayText.innerText = "Erro ao conectar com o servidor Node.js.";
          console.error("Erro no Fetch:", err);
        }
      };

      recognition.onend = () => {
        coreBtn.classList.remove('listening');
      };

      recognition.onerror = (event) => {
        console.error("Erro detalhado do SpeechRecognition:", event.error);
        coreBtn.classList.remove('listening');
        displayText.innerText = `Erro no microfone: ${event.error}. Tente novamente.`;
      };
    }
  </script>
</body>
</html>
