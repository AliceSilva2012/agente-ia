<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">

  <title>J.A.R.V.I.S.</title>
</head>
<body>

  <button id="core-btn">LIGAR CORE</button>
  <div id="display-text">Clique no botão para falar com o J.A.R.V.I.S.</div>

  <script>
    function falar(texto) {
      window.speechSynthesis.cancel(); // Cancela falas anteriores para não acumular

      // Limpa caracteres especiais, parênteses e tópicos numerados antes de ler
      const textoLimpo = texto.replace(/\(.*?\)/g, '').replace(/\d+\.\s*/g, '').trim();
      
      const utterance = new SpeechSynthesisUtterance(textoLimpo);
      utterance.lang = 'pt-BR';

      const aplicarVoz = () => {
        const voices = window.speechSynthesis.getVoices();
        
        // Procura por vozes masculinas conhecidas em português
        const vozMasculina = voices.find(voice => 
          voice.lang.includes('pt') && 
          (voice.name.includes('Daniel') || 
           voice.name.includes('Jorge') || 
           voice.name.includes('Ricardo') || 
           voice.name.toLowerCase().includes('male'))
        );

        if (vozMasculina) {
          utterance.voice = vozMasculina;
        }

        // Ajusta o tom para soar mais grave (estilo JARVIS)
        utterance.pitch = 0.85; 
        utterance.rate = 1.0;   

        window.speechSynthesis.speak(utterance);
      };

      if (window.speechSynthesis.getVoices().length !== 0) {
        aplicarVoz();
      } else {
        window.speechSynthesis.onvoiceschanged = aplicarVoz;
      }
    }

    const coreBtn = document.getElementById('core-btn');
    const displayText = document.getElementById('display-text');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      displayText.innerText = "Navegador não suporta a Web Speech API.";
    } else {
      const recognition = new SpeechRecognition();
      
      recognition.lang = 'pt-BR';
      recognition.continuous = false;
      recognition.interimResults = false;

      coreBtn.addEventListener('click', () => {
        try {
          recognition.start();
          coreBtn.classList.add('listening');
          displayText.innerText = "Ouvindo você, Senhorita...";
        } catch (e) {
          console.log("Reconhecimento já estava ativo ou em transição:", e);
        }
      });

      recognition.onresult = async (event) => {
        const transcricao = event.results[0][0].transcript;
        console.log("Transcrição capturada:", transcricao);
        
        coreBtn.classList.remove('listening');
        displayText.innerText = `Você: "${transcricao}"`;

        try {
          displayText.innerText = "J.A.R.V.I.S. está pensando...";

          const respostaServidor = await fetch('http://localhost:3000/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: transcricao })
          });

          const data = await respostaServidor.json();

          displayText.innerText = `"${data.reply}"`;
          falar(data.reply);
        } catch (err) {
          displayText.innerText = "Erro ao conectar com o servidor Node.js.";
          console.error("Erro no Fetch:", err);
        }
      };

      recognition.onerror = (event) => {
        console.error("Erro detalhado do SpeechRecognition:", event.error);
        coreBtn.classList.remove('listening');
        displayText.innerText = `Erro no microfone: ${event.error}. Tente novamente.`;
      };
    }
  </script>
</body>
</html>
